<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t">
  <title id="t">Field Guide 002: Win the job in the first five minutes. Bars falling as the minutes pass.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1219"/><stop offset="1" stop-color="#080b10"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#ff7547" stop-opacity=".3"/><stop offset="1" stop-color="#ff7547" stop-opacity="0"/></radialGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7547"/><stop offset="1" stop-color="#ff9a73"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#grid)"/><rect width="1600" height="1000" fill="url(#glow)"/>
  <g transform="translate(96 92)"><rect y="24" width="40" height="40" fill="#e0e6eb"/><rect x="24" width="40" height="40" fill="#e0e6eb"/><rect x="24" y="24" width="16" height="16" fill="#ff7547"/>
  <text x="88" y="50" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="3" fill="#8793a0">FIELD GUIDE 002</text></g>
<text x="96" y="230" font-family="Manrope, Arial, sans-serif" font-size="64" font-weight="600" fill="#fff" letter-spacing="-2">The first reply wins.</text><rect x="420" y="330" width="760" height="64" rx="16" fill="url(#hot)"/><text x="96" y="373" font-family="Manrope, Arial, sans-serif" font-size="32" font-weight="600" fill="#e8edf1" >0-5 min</text><rect x="420" y="450" width="470" height="64" rx="16" fill="#222a35"/><text x="96" y="493" font-family="Manrope, Arial, sans-serif" font-size="32" font-weight="600" fill="#8793a0" >30 min</text><rect x="420" y="570" width="330" height="64" rx="16" fill="#222a35"/><text x="96" y="613" font-family="Manrope, Arial, sans-serif" font-size="32" font-weight="600" fill="#8793a0" >1 hour</text><rect x="420" y="690" width="150" height="64" rx="16" fill="#222a35"/><text x="96" y="733" font-family="Manrope, Arial, sans-serif" font-size="32" font-weight="600" fill="#8793a0" >24 hours</text><text x="420" y="840" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="500" fill="#8793a0" >Illustrative: the longer a lead waits, the colder it gets.</text></svg>
