<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t">
  <title id="t">Field Guide 006: Keep a person in control. A flow from document to AI draft through an approval gate to the action, blocking a hostile instruction.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1219"/><stop offset="1" stop-color="#080b10"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#ff7547" stop-opacity=".3"/><stop offset="1" stop-color="#ff7547" stop-opacity="0"/></radialGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7547"/><stop offset="1" stop-color="#ff9a73"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#grid)"/><rect width="1600" height="1000" fill="url(#glow)"/>
  <g transform="translate(96 92)"><rect y="24" width="40" height="40" fill="#e0e6eb"/><rect x="24" width="40" height="40" fill="#e0e6eb"/><rect x="24" y="24" width="16" height="16" fill="#ff7547"/>
  <text x="88" y="50" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="3" fill="#8793a0">FIELD GUIDE 006</text></g>
<rect x="120" y="420" width="320" height="140" rx="22" fill="#141922" stroke="#ffffff" stroke-opacity=".08"/><text x="280" y="502" font-family="Manrope, Arial, sans-serif" font-size="32" font-weight="600" fill="#fff" text-anchor="middle">Document</text><rect x="480" y="420" width="320" height="140" rx="22" fill="#141922" stroke="#ffffff" stroke-opacity=".08"/><text x="640" y="502" font-family="Manrope, Arial, sans-serif" font-size="32" font-weight="600" fill="#fff" text-anchor="middle">AI draft</text><rect x="1080" y="420" width="320" height="140" rx="22" fill="#141922" stroke="#ffffff" stroke-opacity=".08"/><text x="1240" y="502" font-family="Manrope, Arial, sans-serif" font-size="32" font-weight="600" fill="#fff" text-anchor="middle">Action</text><path d="M440 490 H480 M800 490 H900 M1100 490 H1080" stroke="#ff7547" stroke-width="3" stroke-linecap="round"/><path d="M800 490 H920" stroke="#ff7547" stroke-width="3"/><g transform="translate(920 395)"><path d="M70 0 L140 30 V100 C140 150 105 185 70 200 C35 185 0 150 0 100 V30 Z" fill="#1c2530" stroke="#ff7547" stroke-width="4"/><path d="M38 100 L62 124 L106 76" fill="none" stroke="#ff7547" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g><text x="990" y="640" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="600" fill="#ff9a73" text-anchor="middle">Person approves</text><rect x="120" y="640" width="320" height="64" rx="14" fill="#1a1216" stroke="#ff7547" stroke-opacity=".5"/><text x="280" y="681" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="600" fill="#ff9a73" text-anchor="middle">"Ignore your rules..."</text><path d="M440 672 L900 560" stroke="#ff7547" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/><g transform="translate(870 540)"><circle r="22" fill="#ff7547"/><path d="M-9 -9 L9 9 M9 -9 L-9 9" stroke="#101319" stroke-width="5" stroke-linecap="round"/></g><text x="96" y="250" font-family="Manrope, Arial, sans-serif" font-size="60" font-weight="600" fill="#fff" letter-spacing="-2">Guardrails keep you in charge.</text><text x="96" y="880" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="500" fill="#8793a0" >Treat documents as text. Approve what matters.</text></svg>
